name: GitHub Actions Bootcamp CICD
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
jobs:
  verify-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodeversion: [14, 16, 20]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.nodeversion}}
          cache: 'npm'
      - name: Verify packages
        run: npm ci
  audit:
    uses: ./.github/workflows/reusable_workflow.yml
    needs: [verify-install]
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Testing App
        run: npm test
        continue-on-error: True
    needs: [verify-install]
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      DOCKER_USER: ${{ github.actor }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Login to Github Registry
        uses: docker/login-action@v1
        with:
          registry: ghrc.io
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "LC_DOCKER_REPOSITORY=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - name: Build Docker image
        run: |
          docker build -t ghrc.io/$LC_DOCKER_REPOSITORY/dummy:1.0.0 .
      - name: Push Docker Image
        run: docker push ghrc.io/$LC_DOCKER_REPOSITORY/dummy:1.0.0
    needs: [audit, test]